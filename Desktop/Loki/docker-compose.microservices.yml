version: '3.8'

services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: constellation-postgres
    environment:
      POSTGRES_DB: constellation_markets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_MULTIPLE_DATABASES: "user_service,market_service,trading_service,payment_service,analytics_service"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/create-multiple-databases.sh:/docker-entrypoint-initdb.d/create-multiple-databases.sh
    networks:
      - constellation-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: constellation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    networks:
      - constellation-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Message Queue
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: constellation-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - constellation-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: constellation-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - constellation-network

  # Service Discovery
  consul:
    image: consul:1.17
    container_name: constellation-consul
    ports:
      - "8500:8500"
    command: consul agent -dev -client=0.0.0.0 -ui
    networks:
      - constellation-network

  # API Gateway
  kong:
    image: kong:3.4-alpine
    container_name: constellation-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PLUGINS: bundled,prometheus
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    volumes:
      - ./microservices/api-gateway/kong.yml:/opt/kong/kong.yml:ro
    networks:
      - constellation-network

  # Microservices
  user-service:
    build: ./microservices/user-service
    container_name: constellation-user-service
    environment:
      NODE_ENV: production
      PORT: 3001
      GRPC_PORT: 50001
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-password}@postgres:5432/user_service
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-user-service-secret}
      CONSUL_URL: http://consul:8500
    ports:
      - "3001:3001"
      - "50001:50001"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      consul:
        condition: service_started
    networks:
      - constellation-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  market-service:
    build: ./microservices/market-service
    container_name: constellation-market-service
    environment:
      NODE_ENV: production
      PORT: 3002
      GRPC_PORT: 50002
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-password}@postgres:5432/market_service
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      USER_SERVICE_URL: user-service:50001
    ports:
      - "3002:3002"
      - "50002:50002"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - kafka
      - user-service
    networks:
      - constellation-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  trading-service:
    build: ./microservices/trading-service
    container_name: constellation-trading-service
    environment:
      NODE_ENV: production
      PORT: 3003
      GRPC_PORT: 50003
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-password}@postgres:5432/trading_service
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      USER_SERVICE_URL: user-service:50001
      MARKET_SERVICE_URL: market-service:50002
    ports:
      - "3003:3003"
      - "50003:50003"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - kafka
      - user-service
      - market-service
    networks:
      - constellation-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  ai-service:
    build: ./microservices/ai-service
    container_name: constellation-ai-service
    environment:
      NODE_ENV: production
      PORT: 3004
      GRPC_PORT: 50004
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      WATSON_API_KEY: ${WATSON_API_KEY}
      WATSON_NLU_API_KEY: ${WATSON_NLU_API_KEY}
      WATSON_VR_API_KEY: ${WATSON_VR_API_KEY}
      WATSON_DISCOVERY_API_KEY: ${WATSON_DISCOVERY_API_KEY}
      MODEL_STORAGE_PATH: /app/models
    ports:
      - "3004:3004"
      - "50004:50004"
    volumes:
      - ai-models:/app/models
      - ./logs:/app/logs
    depends_on:
      - redis
      - kafka
    networks:
      - constellation-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '1.0'

  payment-service:
    build: ./microservices/payment-service
    container_name: constellation-payment-service
    environment:
      NODE_ENV: production
      PORT: 3005
      GRPC_PORT: 50005
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-password}@postgres:5432/payment_service
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      USER_SERVICE_URL: user-service:50001
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
    ports:
      - "3005:3005"
      - "50005:50005"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - kafka
      - user-service
    networks:
      - constellation-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  notification-service:
    build: ./microservices/notification-service
    container_name: constellation-notification-service
    environment:
      NODE_ENV: production
      PORT: 3006
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    ports:
      - "3006:3006"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
      - kafka
    networks:
      - constellation-network
    restart: unless-stopped

  analytics-service:
    build: ./microservices/analytics-service
    container_name: constellation-analytics-service
    environment:
      NODE_ENV: production
      PORT: 3007
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-password}@postgres:5432/analytics_service
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    ports:
      - "3007:3007"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - constellation-network
    restart: unless-stopped

  admin-service:
    build: ./microservices/admin-service
    container_name: constellation-admin-service
    environment:
      NODE_ENV: production
      PORT: 3008
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-password}@postgres:5432/constellation_markets
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      USER_SERVICE_URL: user-service:50001
      MARKET_SERVICE_URL: market-service:50002
      TRADING_SERVICE_URL: trading-service:50003
    ports:
      - "3008:3008"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - kafka
      - user-service
      - market-service
      - trading-service
    networks:
      - constellation-network
    restart: unless-stopped

  # Analytics Database (ClickHouse for OLAP)
  clickhouse:
    image: clickhouse/clickhouse-server:23.10-alpine
    container_name: constellation-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics123}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./analytics/clickhouse-config.xml:/etc/clickhouse-server/config.d/config.xml:ro
    networks:
      - constellation-network
    restart: unless-stopped

  # Frontend Application
  frontend:
    build: ./frontend
    container_name: constellation-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://kong:8000
      NEXT_PUBLIC_WS_URL: http://kong:8000
    ports:
      - "3001:3000"
    depends_on:
      - kong
    networks:
      - constellation-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  zookeeper-data:
  kafka-data:
  clickhouse-data:
  ai-models:

networks:
  constellation-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16