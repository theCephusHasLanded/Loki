apiVersion: v1
kind: Namespace
metadata:
  name: constellation-markets
  labels:
    name: constellation-markets
    environment: production
    app: constellation-markets
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: constellation-quota
  namespace: constellation-markets
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "20"
    services: "20"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: constellation-limits
  namespace: constellation-markets
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "1Gi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    type: Container
  - default:
      storage: "10Gi"
    type: PersistentVolumeClaim